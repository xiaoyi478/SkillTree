<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Microsoft YaHei, sans-serif">
  <rect width="760" height="360" fill="#f7f9fc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">Docker Compose：一份配置，启动多个容器</text>

  <!-- 配置文件 -->
  <rect x="50" y="120" width="190" height="150" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="145" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#be185d">docker-compose.yml</text>
  <text x="145" y="188" text-anchor="middle" font-size="12" fill="#334155">web 服务</text>
  <text x="145" y="210" text-anchor="middle" font-size="12" fill="#334155">db 服务</text>
  <text x="145" y="232" text-anchor="middle" font-size="12" fill="#334155">… </text>

  <!-- 命令 -->
  <rect x="290" y="140" width="130" height="110" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="355" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">docker compose</text>
  <text x="355" y="205" text-anchor="middle" font-size="13" fill="#334155">up -d</text>
  <text x="355" y="228" text-anchor="middle" font-size="12" fill="#64748b">一条命令全起</text>

  <!-- 服务们 -->
  <rect x="470" y="100" width="250" height="190" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="595" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">多个容器</text>
  <rect x="490" y="148" width="120" height="44" rx="8" fill="#fff" stroke="#0ea5e9"/>
  <text x="550" y="176" text-anchor="middle" font-size="13" fill="#0369a1">web 应用 :5000</text>
  <rect x="490" y="205" width="120" height="44" rx="8" fill="#fff" stroke="#f59e0b"/>
  <text x="550" y="233" text-anchor="middle" font-size="13" fill="#b45309">db 数据库 :5432</text>

  <!-- 网络标注 -->
  <rect x="620" y="148" width="90" height="101" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="665" y="182" text-anchor="middle" font-size="12" fill="#4338ca">同一网络</text>
  <text x="665" y="202" text-anchor="middle" font-size="11" fill="#64748b">服务名互访</text>
  <text x="665" y="222" text-anchor="middle" font-size="11" fill="#64748b">自动配置</text>

  <!-- 箭头 -->
  <path d="M245 195 L285 195" stroke="#ec4899" stroke-width="2.5" fill="none" marker-end="url(#e1)"/>
  <path d="M425 195 L465 195" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#e2)"/>

  <text x="380" y="330" text-anchor="middle" font-size="13" fill="#64748b">好处：一条命令启动/管理整套服务；服务用服务名互通；数据用命名卷保留</text>
  <defs>
    <marker id="e1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#ec4899"/></marker>
    <marker id="e2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6366f1"/></marker>
  </defs>
</svg>
