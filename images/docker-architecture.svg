<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Microsoft YaHei, sans-serif">
  <rect width="760" height="340" fill="#f7f9fc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">Docker 工作流程（谁在干活）</text>

  <!-- 客户端 -->
  <rect x="30" y="130" width="170" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="115" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#4338ca">客户端</text>
  <text x="115" y="196" text-anchor="middle" font-size="13" fill="#334155">你敲命令的地方</text>
  <text x="115" y="216" text-anchor="middle" font-size="13" fill="#334155">docker run ...</text>

  <!-- 守护进程 -->
  <rect x="270" y="110" width="220" height="170" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="380" y="152" text-anchor="middle" font-size="17" font-weight="bold" fill="#0369a1">守护进程 Daemon</text>
  <text x="380" y="176" text-anchor="middle" font-size="13" fill="#0c4a6e">真正的"后厨"，负责创建/运行/删除</text>
  <!-- 容器小方块 -->
  <rect x="292" y="200" width="80" height="44" rx="8" fill="#fff" stroke="#0ea5e9"/>
  <text x="332" y="226" text-anchor="middle" font-size="12" fill="#0369a1">容器A</text>
  <rect x="385" y="200" width="80" height="44" rx="8" fill="#fff" stroke="#0ea5e9"/>
  <text x="425" y="226" text-anchor="middle" font-size="12" fill="#0369a1">容器B</text>

  <!-- 仓库 -->
  <rect x="560" y="130" width="170" height="120" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="645" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#be185d">仓库 Registry</text>
  <text x="645" y="196" text-anchor="middle" font-size="13" fill="#334155">Docker Hub</text>
  <text x="645" y="216" text-anchor="middle" font-size="13" fill="#334155">存放现成镜像</text>

  <!-- 箭头 -->
  <path d="M205 175 L265 175" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="235" y="165" text-anchor="middle" font-size="12" fill="#6366f1">指令</text>
  <path d="M495 175 L555 175" stroke="#ec4899" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
  <text x="525" y="165" text-anchor="middle" font-size="12" fill="#be185d">pull/push</text>

  <text x="380" y="322" text-anchor="middle" font-size="13" fill="#64748b">你（客户端）点单 → 后厨（守护进程）做菜 → 菜谱（镜像）来自超市（仓库）</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6366f1"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#ec4899"/></marker>
  </defs>
</svg>
