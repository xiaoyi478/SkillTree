<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Microsoft YaHei, sans-serif">
  <rect width="760" height="380" fill="#f7f9fc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">Kubernetes 集群：Deployment / Service / Pod</text>

  <!-- 集群外框 -->
  <rect x="40" y="70" width="680" height="230" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="380" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">Kubernetes 集群 Cluster</text>

  <!-- 节点1 -->
  <rect x="80" y="130" width="260" height="140" rx="14" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="210" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">节点 Node 1</text>
  <rect x="100" y="172" width="110" height="34" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="155" y="194" text-anchor="middle" font-size="12" fill="#15803d">Pod · nginx-1</text>
  <rect x="220" y="172" width="110" height="34" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="275" y="194" text-anchor="middle" font-size="12" fill="#15803d">Pod · nginx-2</text>
  <rect x="100" y="216" width="230" height="30" rx="7" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="215" y="236" text-anchor="middle" font-size="12" fill="#075985">由 Deployment 管理（副本数=2）</text>

  <!-- 节点2 -->
  <rect x="400" y="130" width="280" height="140" rx="14" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="540" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">节点 Node 2</text>
  <rect x="420" y="172" width="240" height="30" rx="7" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="540" y="192" text-anchor="middle" font-size="12" fill="#075985">其他 Pod / 服务</text>
  <rect x="420" y="212" width="240" height="30" rx="7" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="540" y="232" text-anchor="middle" font-size="12" fill="#075985">（自动调度、故障自愈）</text>

  <!-- Service -->
  <rect x="200" y="290" width="360" height="44" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Service：给这组 Pod 一个固定访问地址（负载均衡）</text>

  <!-- 底部说明 -->
  <text x="380" y="368" text-anchor="middle" font-size="13" fill="#64748b">你只需声明「要什么、几个副本」，K8s 自动调度、扩缩、自愈</text>
</svg>
