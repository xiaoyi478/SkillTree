<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" font-family="Microsoft YaHei, sans-serif">
  <rect width="740" height="340" fill="#f7f9fc"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">端口映射 -p 8080:80</text>

  <!-- 浏览器 -->
  <rect x="30" y="130" width="150" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="105" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">浏览器</text>
  <text x="105" y="190" text-anchor="middle" font-size="12" fill="#334155">localhost:8080</text>

  <!-- 宿主机 -->
  <rect x="250" y="100" width="200" height="180" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="350" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#0369a1">宿主机（你的电脑）</text>
  <rect x="280" y="150" width="140" height="44" rx="8" fill="#fff" stroke="#0ea5e9"/>
  <text x="350" y="178" text-anchor="middle" font-size="14" fill="#0369a1">端口 8080</text>
  <text x="340" y="220" text-anchor="middle" font-size="12" fill="#64748b">对外的"门牌"</text>

  <!-- 容器 -->
  <rect x="500" y="100" width="200" height="180" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">容器内的 Nginx</text>
  <rect x="530" y="150" width="140" height="44" rx="8" fill="#fff" stroke="#22c55e"/>
  <text x="600" y="178" text-anchor="middle" font-size="14" fill="#15803d">端口 80</text>
  <text x="600" y="220" text-anchor="middle" font-size="12" fill="#64748b">程序监听的端口</text>

  <!-- 箭头 -->
  <path d="M185 175 L245 175" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#b1)"/>
  <text x="215" y="165" text-anchor="middle" font-size="12" fill="#6366f1">访问</text>
  <path d="M455 175 L495 175" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#b2)"/>
  <text x="477" y="165" text-anchor="middle" font-size="12" fill="#16a34a">8080→80</text>

  <text x="370" y="320" text-anchor="middle" font-size="13" fill="#64748b">含义：把"你的电脑的8080端口"连到"容器里的80端口"，这样浏览器才能看到容器里的网页</text>
  <defs>
    <marker id="b1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6366f1"/></marker>
    <marker id="b2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#22c55e"/></marker>
  </defs>
</svg>
